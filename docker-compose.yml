version: '3.8'

services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_DB=project
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root123
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mail.com
      - PGADMIN_DEFAULT_PASSWORD=root
    ports:
      - 5050:80

